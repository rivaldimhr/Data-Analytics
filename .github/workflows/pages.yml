name: Dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang dependensi
        run: |
          pip install -q pandas numpy pytest playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Jalankan ulang analisis (06–08)
        run: |
          python notebooks/06_model_comparison.py
          python notebooks/07_data_quality.py
          python notebooks/08_policy_brief.py
      - name: Pastikan hasil analisis bisa diulang persis
        run: git diff --exit-code -- outputs/model_results

      - name: Test data + dashboard di browser
        env:
          REQUIRE_CDN: '1'
        run: python -m pytest tests -v

      - name: Susun situs + PDF ringkasan
        run: python scripts/build_site.py site --pdf
      - name: Screenshot dashboard
        run: |
          mkdir -p site/check
          (cd site && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          python scripts/check_dashboard.py http://localhost:8000/ site/check > site/check/report.txt; cat site/check/report.txt

      - name: Deploy ke gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
